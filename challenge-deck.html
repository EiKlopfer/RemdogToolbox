<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Challenge Deck · Earthborne Rangers</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --awa: #2d6a4f;
    --awa-light: #52b788;
    --awa-bg: #1b4332;
    --spi: #b5850a;
    --spi-light: #f4c542;
    --spi-bg: #7d5a0a;
    --fit: #9b2226;
    --fit-light: #e05c60;
    --fit-bg: #6a1316;
    --foc: #1d4e89;
    --foc-light: #4a90d9;
    --foc-bg: #122d52;
    --crest-bg: #8b1a1a;
    --mountain-bg: #1a3a6b;
    --sun-bg: #8a6400;
    --bg: #0f0e0c;
    --surface: #1a1814;
    --surface2: #242018;
    --border: #3a3428;
    --text: #e8e0cc;
    --text-dim: #8a8070;
    --radius: 16px;
    --card-w: min(440px, calc(100vw - 24px));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* Atmospheric background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(45,106,79,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 20% 80%, rgba(155,34,38,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 60%, rgba(29,78,137,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  @media (max-width: 480px) {
    .main { gap: 12px; padding: 6px 12px 14px; }
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 12px 20px;
    gap: 16px;
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
  }

  /* DECK STATUS */
  .deck-status {
    display: flex;
    gap: 12px;
    width: 100%;
    justify-content: center;
  }

  .pile {
    flex: 1;
    max-width: 140px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }

  .pile-count {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
  }

  .pile-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 3px;
  }

  /* CARD */
  .card-area {
    width: var(--card-w);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .card {
    width: 100%;
    aspect-ratio: 3/4;
    display: flex;
    flex-direction: column;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.5),
      0 2px 8px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.05);
    position: relative;
    transition: transform 0.15s ease, opacity 0.15s ease;
    flex-shrink: 0;
  }

  .card.animating-out {
    animation: cardOut 0.3s ease forwards;
  }

  .card.animating-in {
    animation: cardIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes cardOut {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-40px) scale(0.95); opacity: 0; }
  }

  @keyframes cardIn {
    0% { transform: translateY(30px) scale(0.92); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* Aspect grid - top 80% */
  .aspects {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    flex: 4;
    min-height: 0;
  }

  .aspect-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 8px;
    position: relative;
    overflow: hidden;
  }

  .aspect-cell::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .aspect-cell.awa { background: var(--awa-bg); border-bottom: 1px solid rgba(0,0,0,0.3); border-right: 1px solid rgba(0,0,0,0.3); }
  .aspect-cell.spi { background: var(--spi-bg); border-bottom: 1px solid rgba(0,0,0,0.3); }
  .aspect-cell.fit { background: var(--fit-bg); border-right: 1px solid rgba(0,0,0,0.3); }
  .aspect-cell.foc { background: var(--foc-bg); }

  .aspect-modifier {
    font-family: 'Cinzel', serif;
    font-size: clamp(36px, 14vw, 88px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .awa .aspect-modifier { color: var(--awa-light); }
  .spi .aspect-modifier { color: var(--spi-light); }
  .fit .aspect-modifier { color: var(--fit-light); }
  .foc .aspect-modifier { color: var(--foc-light); }

  .aspect-name {
    font-family: 'Cinzel', serif;
    font-size: clamp(9px, 2.5vw, 14px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 4px;
    opacity: 0.7;
  }

  /* Challenge icon - bottom 20% */
  .challenge-band {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  .challenge-band::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 100%);
  }

  .challenge-band.crest { background: var(--crest-bg); }
  .challenge-band.mountain { background: var(--mountain-bg); }
  .challenge-band.sun { background: var(--sun-bg); }

  .challenge-icon {
    width: clamp(36px, 11vw, 64px);
    height: clamp(36px, 11vw, 64px);
    position: relative;
    z-index: 1;
  }

  .shuffle-diamond {
    position: absolute;
    left: 80%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: clamp(18px, 5.5vw, 32px);
    height: clamp(36px, 11vw, 64px);
    z-index: 2;
  }

  .pile-btn {
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .pile-btn:hover { border-color: var(--text-dim); background: var(--surface2); }
  .pile-stats-icon { font-size: 22px; line-height: 1.2; }

  .stats-body {
    padding: 20px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .stats-section-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .stats-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Cinzel', serif;
  }

  .stats-table th {
    padding: 8px 6px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .stats-table td {
    padding: 9px 6px;
    text-align: center;
    vertical-align: middle;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .stats-table tr:last-child td { border-bottom: none; }

  .stats-table td.mod-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dim);
    text-align: left;
    padding-left: 4px;
  }

  .stats-table td.zero { color: var(--text-dim); }
  .stats-table td.zero .stats-pct { font-weight: 400; }

  .stats-pct {
    font-size: 19px;
    font-weight: 700;
    display: block;
    line-height: 1.1;
  }

  .stats-raw {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-dim);
    display: block;
    line-height: 1.3;
  }

  #stats-modal .modal {
    max-width: 560px;
    max-height: 92dvh;
  }

  .stats-icons {
    display: flex;
    gap: 10px;
  }

  .stats-icon-tile {
    flex: 1;
    border-radius: 10px;
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .stats-icon-tile svg { width: 32px; height: 32px; }

  .stats-icon-count {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }

  .stats-icon-name {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.75;
  }

  /* Empty state card */
  .card-empty {
    width: 100%;
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    aspect-ratio: 4/5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-dim);
  }

  .card-empty svg { opacity: 0.3; }

  .card-empty p {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.5;
    text-align: center;
    padding: 0 20px;
  }

  /* BUTTONS */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }

  .btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #2d3a2a 0%, #1e2a1c 100%);
    border: 1px solid var(--awa);
    border-radius: 10px;
    color: var(--awa-light);
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .btn-primary:active {
    transform: scale(0.98);
    background: linear-gradient(135deg, #3d4e38 0%, #2d3a2a 100%);
  }

  .btn-primary.shuffle-required {
    background: linear-gradient(135deg, #3a2a00 0%, #2a1e00 100%);
    border-color: #c87800;
    color: #f4c542;
  }

  .btn-primary.shuffle-required:active {
    background: linear-gradient(135deg, #4a3500 0%, #3a2a00 100%);
  }

  .btn-primary:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }

  .btn-row {
    display: flex;
    gap: 10px;
  }

  .btn-secondary {
    flex: 1;
    padding: 12px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-secondary:active {
    background: var(--surface2);
    color: var(--text);
    transform: scale(0.97);
  }

  .btn-secondary:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }

  /* HISTORY */
  .history-section {
    width: var(--card-w);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .history-recent {
    display: flex;
    gap: 6px;
    justify-content: center;
  }

  .mini-card {
    width: calc(var(--card-w) / 4);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    opacity: 0.75;
    flex-shrink: 0;
  }

  .mini-aspects {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .mini-aspect-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 4px;
    font-family: 'Cinzel', serif;
    font-size: clamp(10px, 3.2vw, 14px);
    font-weight: 700;
    line-height: 1;
  }

  .mini-aspect-cell.awa { background: var(--awa-bg); color: var(--awa-light); border-bottom: 1px solid rgba(0,0,0,0.3); border-right: 1px solid rgba(0,0,0,0.3); }
  .mini-aspect-cell.spi { background: var(--spi-bg); color: var(--spi-light); border-bottom: 1px solid rgba(0,0,0,0.3); }
  .mini-aspect-cell.fit { background: var(--fit-bg); color: var(--fit-light); border-right: 1px solid rgba(0,0,0,0.3); }
  .mini-aspect-cell.foc { background: var(--foc-bg); color: var(--foc-light); }

  .mini-challenge-band {
    height: 10px;
  }

  .mini-challenge-band.crest { background: var(--crest-bg); }
  .mini-challenge-band.mountain { background: var(--mountain-bg); }
  .mini-challenge-band.sun { background: var(--sun-bg); }

  .history-toggle-btn {
    width: 100%;
    padding: 5px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .history-older {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }

  /* SCOUT X STEPPER */
  .scout-x-stepper {
    display: flex;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .stepper-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 0 10px;
    height: 100%;
    line-height: 1;
    transition: background 0.15s;
  }

  .stepper-btn:active { background: var(--border); }
  .stepper-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .stepper-val {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    min-width: 22px;
    text-align: center;
    color: var(--text);
    padding: 0 2px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: #4a2a00;
    border: 1px solid #c87800;
    border-radius: 10px;
    padding: 12px 20px;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: #f4c542;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.visible {
    transform: translateX(-50%) translateY(0);
  }


  /* SCOUT MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 480px;
    max-height: 85dvh;
    display: flex;
    flex-direction: column;
    transform: scale(0.95);
    transition: transform 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);
    overflow: hidden;
  }

  .modal-overlay.open .modal {
    transform: scale(1);
  }

  .modal-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .modal-title {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text);
  }

  .modal-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  .modal-close {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.1em;
  }

  .scout-list {
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .scout-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    touch-action: none;
    cursor: grab;
    transition: background 0.15s, box-shadow 0.15s;
  }

  .scout-mode-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s, color 0.15s;
  }
  .scout-mode-toggle:hover { border-color: var(--text-dim); color: var(--text); }
  .scout-mode-toggle.active { border-color: var(--foc-light); color: var(--foc-light); }

  .arrow-btns {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex-shrink: 0;
  }

  .arrow-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-dim);
    width: 32px;
    height: 26px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: border-color 0.1s, color 0.1s, background 0.1s;
  }
  .arrow-btn:hover:not(:disabled) { border-color: var(--text); color: var(--text); background: var(--surface2); }
  .arrow-btn:disabled { opacity: 0.2; cursor: default; }

  .scout-drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    opacity: 0.96;
    box-shadow: 0 16px 40px rgba(0,0,0,0.75), 0 0 0 2px var(--awa-light);
    transform: scale(1.04);
    border-radius: 10px;
    transition: none !important;
  }

  .scout-item.dragging {
    opacity: 0.25;
  }

  .scout-item.drag-over {
    box-shadow: 0 0 0 3px var(--awa-light);
    background: #263a22;
    border-color: var(--awa-light);
  }

  .scout-position {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    color: var(--text-dim);
    width: 28px;
    text-align: center;
    flex-shrink: 0;
  }

  .scout-mini-aspects {
    display: flex;
    gap: 4px;
    flex: 1;
  }

  .mini-asp {
    flex: 1;
    border-radius: 5px;
    padding: 6px 4px;
    text-align: center;
  }

  .mini-asp.awa { background: var(--awa-bg); }
  .mini-asp.spi { background: var(--spi-bg); }
  .mini-asp.fit { background: var(--fit-bg); }
  .mini-asp.foc { background: var(--foc-bg); }

  .mini-mod {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }

  .mini-lbl {
    font-size: 10px;
    letter-spacing: 0.1em;
    opacity: 0.6;
    text-transform: uppercase;
  }

  .mini-asp.awa .mini-mod { color: var(--awa-light); }
  .mini-asp.spi .mini-mod { color: var(--spi-light); }
  .mini-asp.fit .mini-mod { color: var(--fit-light); }
  .mini-asp.foc .mini-mod { color: var(--foc-light); }

  .scout-icon-badge {
    width: 44px;
    height: 44px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .scout-icon-badge.crest { background: var(--crest-bg); }
  .scout-icon-badge.mountain { background: var(--mountain-bg); }
  .scout-icon-badge.sun { background: var(--sun-bg); }

  .drag-handle {
    color: var(--text-dim);
    opacity: 0.4;
    flex-shrink: 0;
  }

  .scout-shuffle-pip {
    width: 10px;
    height: 28px;
    flex-shrink: 0;
    opacity: 0.85;
  }

  .scout-zone-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--awa-light);
    opacity: 0.7;
    text-align: center;
    padding: 2px 0;
    flex-shrink: 0;
  }

  .scout-deck-divider {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin: 2px 0;
  }

  .scout-deck-divider::before,
  .scout-deck-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .scout-deck-divider-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .scout-top-drop,
  .scout-bottom-drop {
    min-height: 44px;
    border-radius: 8px;
    border: 1px dashed transparent;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 0;
    transition: border-color 0.15s, background 0.15s;
  }

  .scout-top-drop.drag-over {
    border-style: solid;
    border-color: var(--awa-light);
    background: rgba(82,183,136,0.18);
    box-shadow: inset 0 0 0 1px var(--awa-light);
  }

  .scout-bottom-drop.drag-over {
    border-style: solid;
    border-color: var(--foc-light);
    background: rgba(74,144,217,0.18);
    box-shadow: inset 0 0 0 1px var(--foc-light);
  }

  .bottom-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 16px 16px;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
  }

  .bottom-tag {
    font-size: 10px;
    text-align: center;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .scout-action-row {
    display: flex;
    gap: 8px;
  }

  .btn-bottom {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid;
    transition: all 0.15s;
  }

  .btn-bottom.top {
    background: #1e2d1c;
    border-color: var(--awa);
    color: var(--awa-light);
  }

  .btn-bottom.bottom {
    background: #12233a;
    border-color: var(--foc);
    color: var(--foc-light);
  }

  .btn-confirm {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #2d3a2a 0%, #1e2a1c 100%);
    border: 1px solid var(--awa);
    border-radius: 8px;
    color: var(--awa-light);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }

  /* Scout count input */
  .scout-count-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    justify-content: space-between;
  }

  .scout-count-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .count-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .count-btn {
    width: 32px;
    height: 32px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    transition: all 0.15s;
  }

  .count-btn:active { background: var(--border); }

  .count-val {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
    min-width: 24px;
    text-align: center;
    color: var(--text);
  }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="main">

  <div class="deck-status">
    <div class="pile">
      <div class="pile-count" id="deck-count">24</div>
      <div class="pile-label">In Deck</div>
    </div>
    <button class="pile pile-btn" id="btn-stats">
      <div class="pile-count pile-stats-icon">◈</div>
      <div class="pile-label">Deck Stats</div>
    </button>
  </div>

  <div class="card-area">
    <div id="card-display"></div>
  </div>

  <div class="history-section" id="history-section" style="display:none">
    <button class="history-toggle-btn" id="history-toggle" style="display:none"></button>
    <div class="history-older" id="history-older" style="display:none"></div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btn-draw">Draw Card</button>
    <div class="btn-row">
      <button class="btn-secondary" id="btn-scout-x">Scout</button>
      <div class="scout-x-stepper">
        <button class="stepper-btn" id="scout-x-dec">−</button>
        <span class="stepper-val" id="scout-x-val">1</span>
        <button class="stepper-btn" id="scout-x-inc">+</button>
      </div>
      <button class="btn-secondary" id="btn-reshuffle">Full Shuffle</button>
    </div>
    <div class="btn-row">
      <button class="btn-secondary" id="btn-shuffle-deck">Shuffle Deck</button>
      <button class="btn-secondary" id="btn-undo-draw">Undo Draw</button>
    </div>
  </div>

</div>

<!-- Scout modal -->
<div class="modal-overlay" id="scout-modal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Scout</div>
        <div class="modal-subtitle" id="scout-subtitle"></div>
      </div>
      <button class="scout-mode-toggle" id="scout-mode-toggle">⇅ Arrows</button>
    </div>
    <div class="scout-list" id="scout-list"></div>
    <div class="bottom-actions">
      <div class="bottom-tag" id="scout-hint">Drag to reorder</div>
      <button class="btn-confirm" id="scout-confirm">Confirm Order</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="stats-modal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Deck Stats</div>
        <div class="modal-subtitle" id="stats-subtitle"></div>
      </div>
      <button class="modal-close" id="stats-close">✕</button>
    </div>
    <div class="stats-body" id="stats-body"></div>
  </div>
</div>

<script>
const CARDS = [
  {awa:-1,spi:0,fit:-1,foc:0,icon:'crest',shuffle:false},
  {awa:0,spi:0,fit:-1,foc:1,icon:'mountain',shuffle:false},
  {awa:0,spi:-1,fit:0,foc:1,icon:'crest',shuffle:false},
  {awa:-1,spi:0,fit:1,foc:0,icon:'sun',shuffle:false},
  {awa:1,spi:-1,fit:0,foc:0,icon:'mountain',shuffle:false},
  {awa:-1,spi:1,fit:0,foc:0,icon:'sun',shuffle:false},
  {awa:1,spi:-1,fit:-1,foc:1,icon:'mountain',shuffle:false},
  {awa:-1,spi:0,fit:0,foc:-1,icon:'mountain',shuffle:false},
  {awa:1,spi:-2,fit:1,foc:0,icon:'crest',shuffle:true},
  {awa:0,spi:0,fit:-1,foc:-1,icon:'sun',shuffle:false},
  {awa:0,spi:1,fit:0,foc:-1,icon:'mountain',shuffle:false},
  {awa:0,spi:-1,fit:1,foc:0,icon:'sun',shuffle:false},
  {awa:-1,spi:-1,fit:0,foc:0,icon:'crest',shuffle:false},
  {awa:0,spi:-1,fit:0,foc:-1,icon:'sun',shuffle:false},
  {awa:-2,spi:0,fit:1,foc:1,icon:'sun',shuffle:true},
  {awa:1,spi:1,fit:0,foc:-2,icon:'crest',shuffle:true},
  {awa:0,spi:-1,fit:-1,foc:0,icon:'mountain',shuffle:false},
  {awa:0,spi:1,fit:-1,foc:0,icon:'crest',shuffle:false},
  {awa:1,spi:0,fit:-1,foc:0,icon:'mountain',shuffle:false},
  {awa:1,spi:0,fit:0,foc:-1,icon:'sun',shuffle:false},
  {awa:-1,spi:0,fit:0,foc:1,icon:'crest',shuffle:false},
  {awa:0,spi:1,fit:-2,foc:1,icon:'sun',shuffle:true},
  {awa:-1,spi:1,fit:1,foc:-1,icon:'mountain',shuffle:false},
  {awa:0,spi:0,fit:1,foc:-1,icon:'crest',shuffle:false},
];

const ICONS = {
  crest: `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 6L8 18L20 34L32 18L20 6Z" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    <path d="M20 6L20 34" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <path d="M8 18L32 18" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="3" fill="rgba(255,255,255,0.8)"/>
  </svg>`,
  mountain: `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 34L14 14L20 22L26 12L36 34H4Z" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M14 14L20 22L26 12" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`,
  sun: `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="7" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    <line x1="20" y1="4" x2="20" y2="9" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="31" x2="20" y2="36" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="20" x2="9" y2="20" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
    <line x1="31" y1="20" x2="36" y2="20" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
    <line x1="8.1" y1="8.1" x2="11.6" y2="11.6" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
    <line x1="28.4" y1="28.4" x2="31.9" y2="31.9" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
    <line x1="31.9" y1="8.1" x2="28.4" y2="11.6" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
    <line x1="11.6" y1="28.4" x2="8.1" y2="31.9" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>
  </svg>`
};

// State
let deck = [];
let discard = [];
let currentCard = null;
let shufflePending = false;
let historyExpanded = false;
let scoutCards = [];
let bottomCards = [];
let scoutCount = 3;
let scoutXCount = 1;
let dragSrcIdx = null;
let scoutArrowMode = false;
let dragSrcZone = null;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

const SAVE_KEY = 'challenge-deck-state';

function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ deck, discard, currentCard, shufflePending }));
  } catch(e) {}
}

function init() {
  historyExpanded = false;
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (saved && Array.isArray(saved.deck) && Array.isArray(saved.discard)) {
      deck = saved.deck;
      discard = saved.discard;
      currentCard = saved.currentCard ?? null;
      shufflePending = saved.shufflePending ?? false;
      updateUI();
      return;
    }
  } catch(e) {}
  // No saved state or corrupt — start fresh
  deck = [...CARDS];
  shuffle(deck);
  discard = [];
  currentCard = null;
  shufflePending = false;
  updateUI();
}

function formatMod(v) {
  return v > 0 ? `+${v}` : `${v}`;
}

function buildCardHTML(card, size = 'full') {
  const shuffleDiamond = card.shuffle
    ? `<div class="shuffle-diamond"><svg viewBox="0 0 20 40" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="10,2 18,20 10,38 2,20" stroke="rgba(255,255,255,0.7)" stroke-width="2.5"/></svg></div>`
    : '';
  return `
    <div class="card" id="main-card">
      <div class="aspects">
        <div class="aspect-cell awa">
          <div class="aspect-modifier">${formatMod(card.awa)}</div>
          <div class="aspect-name">Awareness</div>
        </div>
        <div class="aspect-cell spi">
          <div class="aspect-modifier">${formatMod(card.spi)}</div>
          <div class="aspect-name">Spirit</div>
        </div>
        <div class="aspect-cell fit">
          <div class="aspect-modifier">${formatMod(card.fit)}</div>
          <div class="aspect-name">Fitness</div>
        </div>
        <div class="aspect-cell foc">
          <div class="aspect-modifier">${formatMod(card.foc)}</div>
          <div class="aspect-name">Focus</div>
        </div>
      </div>
      <div class="challenge-band ${card.icon}">
        <div class="challenge-icon">${ICONS[card.icon]}</div>
        ${shuffleDiamond}
      </div>
    </div>`;
}

function buildEmptyHTML(msg) {
  return `<div class="card-empty">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <path d="M9 12h6M12 9v6"/>
    </svg>
    <p>${msg}</p>
  </div>`;
}

function buildMiniCardHTML(card) {
  return `<div class="mini-card">
    <div class="mini-aspects">
      <div class="mini-aspect-cell awa">${formatMod(card.awa)}</div>
      <div class="mini-aspect-cell spi">${formatMod(card.spi)}</div>
      <div class="mini-aspect-cell fit">${formatMod(card.fit)}</div>
      <div class="mini-aspect-cell foc">${formatMod(card.foc)}</div>
    </div>
    <div class="mini-challenge-band ${card.icon}"></div>
  </div>`;
}

function updateHistory() {
  const section = document.getElementById('history-section');
  const toggleBtn = document.getElementById('history-toggle');
  const olderEl = document.getElementById('history-older');

  if (discard.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = '';
  toggleBtn.style.display = '';
  const n = discard.length;
  toggleBtn.textContent = historyExpanded ? '▴ Hide discard' : `▾ ${n} discarded`;
  olderEl.innerHTML = historyExpanded ? [...discard].reverse().map(buildMiniCardHTML).join('') : '';
  olderEl.style.display = historyExpanded ? 'flex' : 'none';
}

function updateUI() {
  const display = document.getElementById('card-display');
  if (currentCard) {
    display.innerHTML = buildCardHTML(currentCard);
  } else if (deck.length === 0 && discard.length === 0) {
    display.innerHTML = buildEmptyHTML('No cards — tap New Deck');
  } else {
    display.innerHTML = buildEmptyHTML(deck.length > 0 ? `${deck.length} card${deck.length !== 1 ? 's' : ''} in deck · tap Draw` : 'Deck empty — tap Full Shuffle');
  }

  document.getElementById('deck-count').textContent = deck.length;

  const btnDraw = document.getElementById('btn-draw');
  if (shufflePending) {
    btnDraw.textContent = '↺ Shuffle Discard into Deck';
    btnDraw.classList.add('shuffle-required');
    btnDraw.disabled = false;
  } else {
    btnDraw.textContent = 'Draw Card';
    btnDraw.classList.remove('shuffle-required');
    btnDraw.disabled = deck.length === 0;
  }

  const scoutDisabled = deck.length === 0 && !shufflePending;
  ['btn-scout-x'].forEach(id =>
    document.getElementById(id).disabled = scoutDisabled);
  document.getElementById('btn-shuffle-deck').disabled = deck.length === 0;
  document.getElementById('btn-undo-draw').disabled = !currentCard;
  document.getElementById('btn-reshuffle').disabled = discard.length === 0 && !currentCard;
  updateScoutXStepper();
  updateHistory();
  saveState();
}


function drawCard() {
  if (deck.length === 0) return;

  const display = document.getElementById('card-display');
  const existing = display.querySelector('.card');

  const doAnimate = (cb) => {
    if (existing) {
      existing.classList.add('animating-out');
      setTimeout(cb, 280);
    } else {
      cb();
    }
  };

  doAnimate(() => {
    const card = deck.shift();
    if (currentCard) discard.push(currentCard);
    currentCard = card;
    updateUI();

    const newCard = display.querySelector('.card');
    if (newCard) {
      newCard.classList.add('animating-in');
      setTimeout(() => newCard.classList.remove('animating-in'), 400);
    }

    if (card.shuffle) {
      shufflePending = true;
      updateUI();
    }

    if (deck.length === 0 && !card.shuffle) {
      // auto-reshuffle discard back into deck (current card stays displayed)
      setTimeout(() => {
        if (deck.length === 0 && discard.length > 0) {
          const reshuffled = [...discard];
          shuffle(reshuffled);
          deck = reshuffled;
          discard = [];
          updateUI();
        }
      }, 600);
    }
  });
}

function shuffleDeck() {
  if (deck.length === 0) return;
  shuffle(deck);
  updateUI();
}

function undoDraw() {
  if (!currentCard) return;
  deck.unshift(currentCard);
  if (currentCard.shuffle) shufflePending = false;
  currentCard = discard.length > 0 ? discard.pop() : null;
  showToast('↩ Card returned to top of deck — use Full Shuffle for a random next draw');
  updateUI();
}

function doScout(n) {
  if (shufflePending) {
    reshuffle();
    showToast('↺ Reshuffled — all cards back in deck');
  }
  scoutCount = Math.min(n, deck.length);
  openScout();
}

function updateScoutXStepper() {
  document.getElementById('scout-x-val').textContent = scoutXCount;
  document.getElementById('scout-x-dec').disabled = scoutXCount <= 1;
  document.getElementById('scout-x-inc').disabled = scoutXCount >= 10;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 3000);
}

function reshuffle() {
  const reshuffled = [...discard];
  if (currentCard) reshuffled.push(currentCard);
  shuffle(reshuffled);
  deck = [...deck, ...reshuffled];
  discard = [];
  currentCard = null;
  shufflePending = false;
  shuffle(deck);
  updateUI();
}

// ---- SCOUT ----
function openScout() {
  if (deck.length === 0) return;
  const n = Math.min(scoutCount, deck.length);
  scoutCards = deck.slice(0, n).map((c, i) => ({ ...c, _origIdx: i }));
  bottomCards = [];
  renderScoutModal(n);
  document.getElementById('scout-modal').classList.add('open');
}

function renderScoutModal(n) {
  document.getElementById('scout-subtitle').textContent =
    `Viewing top ${n} of ${n + deck.slice(n).length} cards`;
  renderScoutList();
}

function renderScoutList() {
  const list = document.getElementById('scout-list');

  const upDisabled  = (zone, i) => zone === 'top' && i === 0;
  const downDisabled = (zone, i) => zone === 'bottom' && i === bottomCards.length - 1;

  const itemHTML = (card, zone, i) => `
    <div class="scout-item" ${scoutArrowMode ? '' : 'draggable="true"'} data-zone="${zone}" data-idx="${i}">
      <div class="scout-position">${i + 1}</div>
      <div class="scout-mini-aspects">
        <div class="mini-asp awa"><div class="mini-mod">${formatMod(card.awa)}</div><div class="mini-lbl">AWA</div></div>
        <div class="mini-asp spi"><div class="mini-mod">${formatMod(card.spi)}</div><div class="mini-lbl">SPI</div></div>
        <div class="mini-asp fit"><div class="mini-mod">${formatMod(card.fit)}</div><div class="mini-lbl">FIT</div></div>
        <div class="mini-asp foc"><div class="mini-mod">${formatMod(card.foc)}</div><div class="mini-lbl">FOC</div></div>
      </div>
      <div class="scout-icon-badge ${card.icon}">${ICONS[card.icon]}</div>
      ${card.shuffle ? '<svg class="scout-shuffle-pip" viewBox="0 0 20 40" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="10,2 18,20 10,38 2,20" stroke="#f4c542" stroke-width="2.5"/></svg>' : ''}
      ${scoutArrowMode
        ? `<div class="arrow-btns">
            <button class="arrow-btn" data-action="up"   data-zone="${zone}" data-idx="${i}" ${upDisabled(zone,i)   ? 'disabled' : ''}>▲</button>
            <button class="arrow-btn" data-action="down" data-zone="${zone}" data-idx="${i}" ${downDisabled(zone,i) ? 'disabled' : ''}>▼</button>
           </div>`
        : `<svg class="drag-handle" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
             <line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="16" x2="20" y2="16"/>
           </svg>`
      }
    </div>`;

  list.innerHTML =
    `<div class="scout-zone-label">▲ Top of Deck</div>` +
    `<div class="scout-top-drop" id="scout-top-drop">` +
      scoutCards.map((c, i) => itemHTML(c, 'top', i)).join('') +
    `</div>` +
    `<div class="scout-deck-divider"><span class="scout-deck-divider-label">Rest of Deck</span></div>` +
    `<div class="scout-bottom-drop" id="scout-bottom-drop">` +
      bottomCards.map((c, i) => itemHTML(c, 'bottom', i)).join('') +
      `<div class="scout-zone-label">▼ Bottom of Deck</div>` +
    `</div>`;

  const clearHighlights = () => {
    list.querySelectorAll('.scout-item').forEach(x => x.classList.remove('drag-over'));
    document.getElementById('scout-top-drop')?.classList.remove('drag-over');
    document.getElementById('scout-bottom-drop')?.classList.remove('drag-over');
  };

  const doMove = (srcZone, srcIdx, destZone, destIdx) => {
    const srcArr = srcZone === 'top' ? scoutCards : bottomCards;
    const destArr = destZone === 'top' ? scoutCards : bottomCards;
    const moved = srcArr.splice(srcIdx, 1)[0];
    if (srcZone === destZone) {
      destArr.splice(destIdx, 0, moved);
    } else {
      destArr.splice(destIdx, 0, moved);
    }
    renderScoutList();
  };

  const doMoveToBottomEnd = (srcZone, srcIdx) => {
    const srcArr = srcZone === 'top' ? scoutCards : bottomCards;
    const moved = srcArr.splice(srcIdx, 1)[0];
    bottomCards.push(moved);
    renderScoutList();
  };

  const doMoveToTopStart = (srcZone, srcIdx) => {
    const srcArr = srcZone === 'top' ? scoutCards : bottomCards;
    const moved = srcArr.splice(srcIdx, 1)[0];
    scoutCards.unshift(moved);
    renderScoutList();
  };

  // Sync toggle button + hint text
  const toggleBtn = document.getElementById('scout-mode-toggle');
  if (toggleBtn) {
    toggleBtn.textContent = scoutArrowMode ? '⇄ Drag' : '⇅ Arrows';
    toggleBtn.classList.toggle('active', scoutArrowMode);
  }
  const hint = document.getElementById('scout-hint');
  if (hint) hint.textContent = scoutArrowMode ? 'Use arrows to reorder' : 'Drag to reorder';

  // Arrow button move logic
  const doArrowMove = (zone, idx, dir) => {
    if (dir === 'up') {
      if (zone === 'top') {
        if (idx === 0) return;
        [scoutCards[idx - 1], scoutCards[idx]] = [scoutCards[idx], scoutCards[idx - 1]];
      } else {
        if (idx === 0) { scoutCards.push(bottomCards.splice(0, 1)[0]); }
        else { [bottomCards[idx - 1], bottomCards[idx]] = [bottomCards[idx], bottomCards[idx - 1]]; }
      }
    } else {
      if (zone === 'top') {
        if (idx === scoutCards.length - 1) { bottomCards.unshift(scoutCards.splice(idx, 1)[0]); }
        else { [scoutCards[idx], scoutCards[idx + 1]] = [scoutCards[idx + 1], scoutCards[idx]]; }
      } else {
        if (idx === bottomCards.length - 1) return;
        [bottomCards[idx], bottomCards[idx + 1]] = [bottomCards[idx + 1], bottomCards[idx]];
      }
    }
    renderScoutList();
  };

  if (scoutArrowMode) {
    list.querySelectorAll('.arrow-btn').forEach(btn => {
      btn.addEventListener('click', () =>
        doArrowMove(btn.dataset.zone, parseInt(btn.dataset.idx), btn.dataset.action));
    });
  }

  // Mouse drag events on items
  if (!scoutArrowMode)
  list.querySelectorAll('.scout-item').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragSrcIdx = parseInt(el.dataset.idx);
      dragSrcZone = el.dataset.zone;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', e => { el.classList.remove('dragging'); clearHighlights(); });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.stopPropagation();
      clearHighlights();
      el.classList.add('drag-over');
    });
    el.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      const destZone = el.dataset.zone;
      const destIdx = parseInt(el.dataset.idx);
      if (dragSrcIdx !== null && !(dragSrcZone === destZone && dragSrcIdx === destIdx)) {
        doMove(dragSrcZone, dragSrcIdx, destZone, destIdx);
      }
      dragSrcIdx = null; dragSrcZone = null;
    });

    // Touch drag
    let touchGhost = null;
    let touchStartRect = null;

    const removeGhost = () => {
      if (touchGhost) { touchGhost.remove(); touchGhost = null; }
      el.classList.remove('dragging');
      el.style.opacity = '';
    };

    el.addEventListener('touchstart', e => {
      dragSrcIdx = parseInt(el.dataset.idx);
      dragSrcZone = el.dataset.zone;
      touchStartRect = el.getBoundingClientRect();
      el.style.opacity = '0.25';
      // Create floating ghost
      const ghost = el.cloneNode(true);
      ghost.className += ' scout-drag-ghost';
      ghost.style.left = touchStartRect.left + 'px';
      ghost.style.top = touchStartRect.top + 'px';
      ghost.style.width = touchStartRect.width + 'px';
      document.body.appendChild(ghost);
      touchGhost = ghost;
    }, {passive: true});

    el.addEventListener('touchmove', e => {
      e.preventDefault();
      const touch = e.touches[0];
      const x = touch.clientX;
      const y = touch.clientY;
      // Move ghost above finger
      if (touchGhost && touchStartRect) {
        touchGhost.style.left = (x - touchStartRect.width / 2) + 'px';
        touchGhost.style.top = (y - touchStartRect.height - 14) + 'px';
      }
      clearHighlights();
      const topDrop = document.getElementById('scout-top-drop');
      const tdRect = topDrop?.getBoundingClientRect();
      if (tdRect && y >= tdRect.top && y <= tdRect.bottom && scoutCards.length === 0) {
        topDrop.classList.add('drag-over');
        return;
      }
      const bottomDrop = document.getElementById('scout-bottom-drop');
      const bdRect = bottomDrop?.getBoundingClientRect();
      if (bdRect && y >= bdRect.top && y <= bdRect.bottom) {
        bottomDrop.classList.add('drag-over');
        return;
      }
      for (const item of list.querySelectorAll('.scout-item')) {
        const r = item.getBoundingClientRect();
        if (y >= r.top && y <= r.bottom && item !== el) { item.classList.add('drag-over'); break; }
      }
    }, {passive: false});

    el.addEventListener('touchend', e => {
      removeGhost();
      const y = e.changedTouches[0].clientY;
      clearHighlights();
      const topDrop = document.getElementById('scout-top-drop');
      const tdRect = topDrop?.getBoundingClientRect();
      if (tdRect && y >= tdRect.top && y <= tdRect.bottom && scoutCards.length === 0) {
        doMoveToTopStart(dragSrcZone, dragSrcIdx);
        dragSrcIdx = null; dragSrcZone = null;
        return;
      }
      const bottomDrop = document.getElementById('scout-bottom-drop');
      const bdRect = bottomDrop?.getBoundingClientRect();
      if (bdRect && y >= bdRect.top && y <= bdRect.bottom) {
        doMoveToBottomEnd(dragSrcZone, dragSrcIdx);
        dragSrcIdx = null; dragSrcZone = null;
        return;
      }
      for (const item of list.querySelectorAll('.scout-item')) {
        const r = item.getBoundingClientRect();
        if (y >= r.top && y <= r.bottom && item !== el) {
          const destZone = item.dataset.zone;
          const destIdx = parseInt(item.dataset.idx);
          if (!(dragSrcZone === destZone && dragSrcIdx === destIdx)) {
            doMove(dragSrcZone, dragSrcIdx, destZone, destIdx);
          }
          break;
        }
      }
      dragSrcIdx = null; dragSrcZone = null;
    }, {passive: true});

    el.addEventListener('touchcancel', () => {
      removeGhost();
      clearHighlights();
      dragSrcIdx = null; dragSrcZone = null;
    });
  }); // end forEach scout-item

  if (!scoutArrowMode) {
    // Drop on the top zone itself (empty area when all cards moved to bottom)
    const topDrop = document.getElementById('scout-top-drop');
    if (topDrop) {
      topDrop.addEventListener('dragover', e => {
        e.preventDefault();
        clearHighlights();
        topDrop.classList.add('drag-over');
      });
      topDrop.addEventListener('dragleave', e => {
        if (!topDrop.contains(e.relatedTarget)) topDrop.classList.remove('drag-over');
      });
      topDrop.addEventListener('drop', e => {
        e.preventDefault();
        clearHighlights();
        if (dragSrcIdx !== null) doMoveToTopStart(dragSrcZone, dragSrcIdx);
        dragSrcIdx = null; dragSrcZone = null;
      });
    }

    // Drop on the bottom zone itself (between bottom cards / on the label)
    const bottomDrop = document.getElementById('scout-bottom-drop');
    if (bottomDrop) {
      bottomDrop.addEventListener('dragover', e => {
        e.preventDefault();
        clearHighlights();
        bottomDrop.classList.add('drag-over');
      });
      bottomDrop.addEventListener('dragleave', e => {
        if (!bottomDrop.contains(e.relatedTarget)) bottomDrop.classList.remove('drag-over');
      });
      bottomDrop.addEventListener('drop', e => {
        e.preventDefault();
        clearHighlights();
        if (dragSrcIdx !== null) doMoveToBottomEnd(dragSrcZone, dragSrcIdx);
        dragSrcIdx = null; dragSrcZone = null;
      });
    }
  }
}

function confirmScout() {
  const n = scoutCards.length + bottomCards.length;
  deck = [...scoutCards, ...deck.slice(n), ...bottomCards];
  bottomCards = [];
  closeScout();
  updateUI();
}

function closeScout() {
  document.getElementById('scout-modal').classList.remove('open');
}

function openStats() {
  const n = deck.length;
  document.getElementById('stats-subtitle').textContent =
    `${n} card${n !== 1 ? 's' : ''} remaining in deck`;

  const aspects = ['awa','spi','fit','foc'];
  const labels  = ['AWA','SPI','FIT','FOC'];
  const colors  = ['var(--awa-light)','var(--spi-light)','var(--fit-light)','var(--foc-light)'];
  const modifiers = [1, 0, -1, -2];

  // Build aspect count table (cumulative from +1 downward)
  const counts = {};
  for (const mod of modifiers) {
    counts[mod] = {};
    for (const asp of aspects) counts[mod][asp] = deck.filter(c => c[asp] === mod).length;
  }

  // cumulative[mod][asp] = count of cards with modifier >= mod (i.e. mod through +1)
  const cumulative = {};
  for (const asp of aspects) {
    let running = 0;
    for (const mod of modifiers) { // modifiers = [1, 0, -1, -2] descending
      running += counts[mod][asp];
      if (!cumulative[mod]) cumulative[mod] = {};
      cumulative[mod][asp] = running;
    }
  }

  const total = deck.length;

  const headerCells = aspects.map((a, i) =>
    `<th style="color:${colors[i]}">${labels[i]}</th>`).join('');

  const dataRows = modifiers.map(mod => {
    const cells = aspects.map(a => {
      const cum = cumulative[mod][a];
      const raw = counts[mod][a];
      const pct = total > 0 ? (cum / total * 100).toFixed(1) : '0.0';
      const dim = cum === 0;
      return `<td class="${dim ? 'zero' : ''}">
        <span class="stats-pct">${pct}%</span><span class="stats-raw">${raw}</span>
      </td>`;
    }).join('');
    const sign = mod > 0 ? '+' : '';
    return `<tr><td class="mod-label">${sign}${mod}</td>${cells}</tr>`;
  }).join('');

  // Build icon counts
  const iconCounts = { mountain: 0, crest: 0, sun: 0 };
  for (const c of deck) iconCounts[c.icon]++;

  const iconTiles = [
    { key: 'mountain', label: 'Mountain', bg: 'var(--mountain-bg)', color: '#4a90d9' },
    { key: 'crest',    label: 'Crest',    bg: 'var(--crest-bg)',    color: '#e05c60' },
    { key: 'sun',      label: 'Sun',      bg: 'var(--sun-bg)',      color: '#f4c542' },
  ].map(({ key, label, bg, color }) => `
    <div class="stats-icon-tile" style="background:${bg}20;border:1px solid ${bg}">
      <div style="width:32px;height:32px">${ICONS[key]}</div>
      <div class="stats-icon-count" style="color:${color}">${iconCounts[key]}</div>
      <div class="stats-icon-name" style="color:${color}">${label}</div>
    </div>`).join('');

  document.getElementById('stats-body').innerHTML = `
    <div>
      <div class="stats-section-label">Aspect Modifiers</div>
      <table class="stats-table">
        <thead><tr><th></th>${headerCells}</tr></thead>
        <tbody>${dataRows}</tbody>
      </table>
    </div>
    <div>
      <div class="stats-section-label">Challenge Icons</div>
      <div class="stats-icons">${iconTiles}</div>
    </div>`;

  document.getElementById('stats-modal').classList.add('open');
}

// Wiring
document.getElementById('history-toggle').addEventListener('click', () => {
  historyExpanded = !historyExpanded;
  updateHistory();
});

document.getElementById('btn-draw').addEventListener('click', () => {
  if (shufflePending) reshuffle();
  else drawCard();
});
document.getElementById('btn-reshuffle').addEventListener('click', reshuffle);
document.getElementById('btn-scout-x').addEventListener('click', () => doScout(scoutXCount));
document.getElementById('scout-x-dec').addEventListener('click', () => { scoutXCount = Math.max(1, scoutXCount - 1); updateScoutXStepper(); });
document.getElementById('scout-x-inc').addEventListener('click', () => { scoutXCount = Math.min(10, scoutXCount + 1); updateScoutXStepper(); });
document.getElementById('btn-shuffle-deck').addEventListener('click', shuffleDeck);
document.getElementById('btn-undo-draw').addEventListener('click', undoDraw);
document.getElementById('scout-confirm').addEventListener('click', confirmScout);
document.getElementById('scout-mode-toggle').addEventListener('click', () => {
  scoutArrowMode = !scoutArrowMode;
  renderScoutList();
});
document.getElementById('btn-stats').addEventListener('click', openStats);
document.getElementById('stats-close').addEventListener('click', () =>
  document.getElementById('stats-modal').classList.remove('open'));

init();
</script>
</body>
